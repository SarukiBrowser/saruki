plugins { id 'com.android.application' }

// v1.8: one APK for 32-bit and 64-bit TVs and sticks (-Pabis=armeabi-v7a for a 32-bit-only build)
def abiList = (project.findProperty('abis') ?: 'armeabi-v7a,arm64-v8a').split(',')

android {
    namespace 'io.github.sarukibrowser.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.sarukibrowser.tv'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '1.8.4'
        ndk { abiFilters.addAll(abiList) }
        // v1.7: version of the Saruki Remote phone app bundled inside (served to phones from the TV)
        buildConfigField 'String', 'REMOTE_VERSION', '"1.0.2"'
    }
    buildFeatures { buildConfig true }
    // v1.7: the Saruki Remote protocols (shared with the phone app) and the phone app itself, bundled as an asset
    sourceSets {
        main {
            java.srcDirs += ['../shared/java']
            assets.srcDirs += ["$buildDir/generated/remoteApk"]
        }
    }
    // The key file and its password are never in this repository. The maintainer passes them as gradle properties:
    //   -PsarukiKeystore=/path/saruki.jks -PsarukiKeystorePassword=... -PsarukiKeyPassword=...
    def sarukiKeyFile = file(project.findProperty('sarukiKeystore') ?: '../saruki.jks')
    signingConfigs {
        release {
            // Path and passwords can come from gradle properties (never commit the key).
            storeFile sarukiKeyFile
            storePassword project.findProperty('sarukiKeystorePassword') ?: ''
            keyAlias project.findProperty('sarukiKeyAlias') ?: 'saruki'
            keyPassword project.findProperty('sarukiKeyPassword') ?: (project.findProperty('sarukiKeystorePassword') ?: '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // No key file (anyone building from GitHub): build an unsigned APK instead of failing.
            signingConfig sarukiKeyFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    def media3 = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.18.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'com.google.zxing:core:3.5.3'
}

// v1.7: build Saruki Remote first and put its APK inside Saruki, so the TV can hand it to phones (pairing page).
def remoteApkDir = layout.buildDirectory.dir('generated/remoteApk')
tasks.register('bundleRemoteApk', Copy) {
    dependsOn ':remote:assembleRelease'
    from(project(':remote').layout.buildDirectory.dir('outputs/apk/release')) { include '*.apk' }
    into remoteApkDir
    rename { 'SarukiRemote.apk' }
}
tasks.named('preBuild') { dependsOn 'bundleRemoteApk' }
