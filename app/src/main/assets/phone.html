<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>Saruki remote</title>
<style>
  /* v1.8.3: the "Window" look shared with Saruki on the TV and Saruki Remote */
  :root { --bg:#0b0c0e; --card:#131418; --line:rgba(255,255,255,.12); --acc:#ff5ca8; --txt:#ecedef; --dim:#8e929b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:16px/1.35 Inter,system-ui,-apple-system,Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  body { display:flex; flex-direction:column; padding:12px; gap:10px; overscroll-behavior:none; }
  header { display:flex; align-items:center; justify-content:space-between; }
  header b { font-size:18px; font-weight:600; letter-spacing:-.2px; } header b span { color:var(--acc); }
  #st { font-size:13px; color:var(--dim); }
  #st.ok::before { content:'● '; color:#5fd38d; } #st.bad::before { content:'● '; color:#f0a267; }
  .row { display:flex; gap:8px; }
  textarea { flex:1; min-height:52px; max-height:120px; resize:none; background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:17px; }
  button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:12px 10px; font-size:15px; flex:1; }
  button:active { background:#1f2127; }
  button.p { background:var(--acc); color:#1a0610; border-color:var(--acc); font-weight:600; }
  #pad { flex:1; min-height:240px; border-radius:18px; background:var(--card); border:1px solid var(--line);
    touch-action:none; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:14px; text-align:center; user-select:none; position:relative; }
  #pad.on { border-color:var(--acc); }
  #pad small { position:absolute; bottom:10px; left:0; right:0; font-size:12px; opacity:.7; }
  .tabs { display:flex; gap:6px; } .tabs button { padding:9px 6px; font-size:14px; }
  .tabs button.sel { background:#1f2127; border-color:rgba(255,255,255,.28); color:var(--txt); font-weight:600; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header><b><span>Saruki</span> remote</b><div id="st">connecting…</div></header>

<div class="tabs">
  <button id="tPad" class="sel" onclick="mode('pad')">Touchpad</button>
  <button id="tType" onclick="mode('type')">Type</button>
</div>

<div id="typeBox" class="hide" style="display:flex;flex-direction:column;gap:8px">
  <div class="row"><textarea id="txt" placeholder="Type here. It goes into the box selected on the TV, or the address bar if it's open." autocapitalize="off" autocomplete="off"></textarea></div>
  <div class="row">
    <button class="p" onclick="typeText(false)">Type</button>
    <button onclick="typeText(true)">Type + Enter</button>
  </div>
  <div class="row">
    <button onclick="openLink(false)">Open as link / search</button>
    <button onclick="openLink(true)">Open in new tab</button>
  </div>
  <div class="row">
    <button onclick="send('bs')">⌫ Delete</button>
    <button onclick="send('enter')">↵ Enter</button>
  </div>
</div>

<div id="pad">Slide to move · tap to click<br>two fingers to scroll<small>Hold still 1 s to long-press</small></div>

<div class="row">
  <button onclick="send('back')">◀ Back</button>
  <button onclick="send('menu')">☰ Menu</button>
  <button onclick="send('home')">⌂ Home</button>
  <button onclick="send('pp')">⏯</button>
</div>

<script>
var K = '%TOKEN%', q = [], busy = false, mx = 0, my = 0, sy = 0;
var st = document.getElementById('st');
function flush() {
  if (busy) return;
  if (mx || my) { q.push('m ' + Math.round(mx) + ' ' + Math.round(my)); mx = my = 0; }
  if (sy) { q.push('s ' + Math.round(sy)); sy = 0; }
  if (!q.length) return;
  var body = q.join('\n'); q = []; busy = true;
  fetch('/api?k=' + K, {method:'POST', body:body, keepalive:true}).then(function (r) {
    st.textContent = r.ok ? 'connected' : 'scan the QR again'; st.className = r.ok ? 'ok' : 'bad';
  }).catch(function () { st.textContent = 'TV not reachable'; st.className = 'bad'; })
    .finally(function () { busy = false; if (q.length || mx || my || sy) flush(); });
}
setInterval(flush, 25);
function send(c) { q.push(c); flush(); }
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
send('hello');
function mode(m) {
  document.getElementById('typeBox').classList.toggle('hide', m !== 'type');
  document.getElementById('pad').classList.toggle('hide', m === 'type');
  document.getElementById('tPad').classList.toggle('sel', m === 'pad');
  document.getElementById('tType').classList.toggle('sel', m === 'type');
  if (m === 'type') document.getElementById('txt').focus();
}
function typeText(enter) {
  var t = document.getElementById('txt'); if (!t.value) { if (enter) send('enter'); return; }
  send('t ' + t.value.replace(/\n/g, ' ')); if (enter) send('enter'); t.value = '';
}
function openLink(newTab) {
  var t = document.getElementById('txt'); if (!t.value.trim()) return;
  send((newTab ? 'new ' : 'go ') + t.value.trim()); t.value = '';
}
// touchpad
var pad = document.getElementById('pad'), pts = {}, start = 0, moved = 0, lx = 0, ly = 0, ly2 = 0, lpTimer = 0, fingers = 0;
function accel(d) { var a = Math.abs(d); return d * (a < 3 ? 1.6 : a < 10 ? 2.6 : 4.2); }
pad.addEventListener('pointerdown', function (e) {
  pad.setPointerCapture(e.pointerId); pts[e.pointerId] = [e.clientX, e.clientY]; fingers = Object.keys(pts).length;
  pad.classList.add('on');
  if (fingers === 1) { start = Date.now(); moved = 0; lx = e.clientX; ly = e.clientY;
    clearTimeout(lpTimer); lpTimer = setTimeout(function () { if (moved < 8) { send('long'); buzz(30); moved = 999; } }, 1000); }
  else { clearTimeout(lpTimer); ly2 = avgY(); moved = 999; }
});
function avgY() { var s = 0, n = 0; for (var k in pts) { s += pts[k][1]; n++; } return n ? s / n : 0; }
pad.addEventListener('pointermove', function (e) {
  if (!pts[e.pointerId]) return;
  pts[e.pointerId] = [e.clientX, e.clientY];
  if (fingers >= 2) { var y = avgY(); sy += (ly2 - y) * 4; ly2 = y; return; }
  var dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 8) clearTimeout(lpTimer);
  mx += accel(dx); my += accel(dy);
});
function up(e) {
  delete pts[e.pointerId];
  var left = Object.keys(pts).length;
  if (left === 0) {
    pad.classList.remove('on'); clearTimeout(lpTimer);
    if (fingers === 1 && moved < 8 && Date.now() - start < 350) { send('c'); buzz(12); }
    fingers = 0;
  }
}
pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
</script>
</body>
</html>
