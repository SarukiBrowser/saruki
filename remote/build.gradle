plugins { id 'com.android.application' }

// Saruki Remote: the phone app (trackpad, keyboard, camera for Saruki on the TV). No libraries.
android {
    namespace 'io.github.sarukibrowser.remote'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.sarukibrowser.remote'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }
    sourceSets { main { java.srcDirs += ['../shared/java'] } }
    // The key file and its password are never in this repository. The maintainer passes them as gradle properties:
    //   -PsarukiKeystore=/path/saruki.jks -PsarukiKeystorePassword=... -PsarukiKeyPassword=...
    def sarukiKeyFile = file(project.findProperty('sarukiKeystore') ?: '../saruki.jks')
    signingConfigs {
        release {
            // Same key as Saruki. Path and passwords can come from gradle properties (never commit the key).
            storeFile sarukiKeyFile
            storePassword project.findProperty('sarukiKeystorePassword') ?: ''
            keyAlias project.findProperty('sarukiKeyAlias') ?: 'saruki'
            keyPassword project.findProperty('sarukiKeyPassword') ?: (project.findProperty('sarukiKeystorePassword') ?: '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // No key file (anyone building from GitHub): build an unsigned APK instead of failing.
            signingConfig sarukiKeyFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
